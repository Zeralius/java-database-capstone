<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - Patient Management</title>

    <link rel="icon" type="image/x-icon" th:href="@{/assets/images/favicon.ico}" />

    <link rel="stylesheet" th:include="@{/assets/css/adminDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/doctorDashboard.css}">
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">

    <script th:src="@{/js/render.js}" defer></script>
    <script th:src="@{/js/util.js}" defer></script>

    <script th:src="@{/js/components/header.js}" defer></script>
    <script th:src="@{/js/components/footer.js}" defer></script>
    <script th:src="@{/js/components/patientRows.js}" defer></script>
</head>
<body>

    <div class="container">
        <div class="wrapper">

            <div id="header"></div>

            <main class="main-content">
                
                <section class="controls-section">
                    
                    <div class="search-box">
                        <input type="text" id="searchBar" placeholder="Search by patient name or ID..." />
                    </div>

                    <div class="filter-box">
                        <button type="button" id="btnTodayAppointments" class="dashboard-btn active-filter">
                            Today's Appointments
                        </button>
                        
                        <div class="date-picker-group">
                            <label for="appointmentDatePicker">Select Date:</label>
                            <input type="date" id="appointmentDatePicker" class="input-field" />
                        </div>
                    </div>
                    
                </section>

                <section class="table-container">
                    <table id="patientTable">
                        <thead>
                            <tr>
                                <th>Patient ID</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th>Prescription Action</th>
                            </tr>
                        </thead>
                        <tbody id="patientTableBody">
                            <tr class="placeholder-row">
                                <td colspan="5" style="text-align: center; color: #64748b; padding: 2rem;">
                                    Loading schedule and patient profiles...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>

            </main>

            <div id="footer"></div>

        </div>
    </div>

    <script type="module" th:src="@{/js/services/patientServices.js}" defer></script>
    <script type="module" th:src="@{/js/services/doctorDashboard.js}" defer></script>
</body>
</html>
